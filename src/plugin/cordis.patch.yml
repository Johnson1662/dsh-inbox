# dsh-personal-context bundle layer.
#
# 把队列里的待投事件渲染成一条消息，投进指定会话，唤醒那个 agent。
# 队列由常驻的 daemon 写入；插件只做投递，不判断内容。
- insert:
    - id: dsh-personal-context
      name: dsh-personal-context
      config:
        enabled: true
        stateDir: ~/.dsh/state/personal-context
        sink: chief
        intervalMs: 500
        routes:
          - sources: ["*"]
            sink: chief
        sinks:
          chief:
            kind: dsh-session
            # DSH 的 bot state 以 `session-<uuid>` 为键；sessionId 是兜底写法。
            botId: session-bcba45c8-199d-4f99-8774-bf2b91091466
            sessionId: session-b4d09876-a9a1-47dc-8c3f-9f4633282ada
