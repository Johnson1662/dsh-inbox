name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 零运行时依赖：不需要 npm install
      - run: npm run check

      # 打包是发布路径，路径改错在这里就该挂，而不是等到装进 DSH
      - name: Pack
        run: |
          bash deploy/pack.sh
          # 按 packages 目录遍历，新增来源自动纳入校验
          for dir in packages/core packages/sources/*; do
            name=$(jq -r .name "$dir/package.json")
            ls "$HOME/.dsh/local-pkgs/$name-"*.tgz
          done
          name=$(jq -r .name package.json)
          ls "$HOME/.dsh/local-pkgs/$name-"[0-9]*.tgz
