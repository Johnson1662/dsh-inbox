name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 零运行时依赖：不需要 npm install
      - run: npm run check

      # 打包是发布路径，路径改错在这里就该挂，而不是等到装进 DSH
      - name: Pack
        run: |
          bash deploy/pack.sh
          for pkg in core source-telegram source-feishu; do
            ls "$HOME/.dsh/local-pkgs/dsh-personal-context-${pkg}-"*.tgz
          done
          ls "$HOME/.dsh/local-pkgs/dsh-personal-context-"[0-9]*.tgz
