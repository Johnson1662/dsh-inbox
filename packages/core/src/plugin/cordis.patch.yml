# 核心组件的默认配置。壳包 dsh-personal-context 会把它插进组合里。
- insert:
    - id: dsh-personal-context-core
      name: dsh-personal-context-core
      config:
        enabled: true
        stateDir: ~/.dsh/state/personal-context
        sink: chief
        intervalMs: 500
        batchCount: 50
        batchChars: 4000
        backlogCount: 200
        backlogChars: 20000
        telegramEnabled: true
        telegramIntervalMs: 8000
        feishuEnabled: true
        feishuIntervalMs: 5000
        routes:
          - sources: ["*"]
            sink: session-bcba45c8-199d-4f99-8774-bf2b91091466
        sinks:
          chief:
            kind: dsh-session
            botId: session-bcba45c8-199d-4f99-8774-bf2b91091466
            sessionId: session-b4d09876-a9a1-47dc-8c3f-9f4633282ada
