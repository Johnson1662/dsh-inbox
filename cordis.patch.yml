# dsh-inbox —— 装这一个包就够：包内带 core 与四路来源，这里只把它插进组合。
- insert:
    - id: dsh-inbox
      name: '@johnson1662/dsh-inbox'
      config:
        enabled: true
        stateDir: ~/.dsh/state/personal-context
        sink: chief
        intervalMs: 500
        batchCount: 50
        batchChars: 4000
        backlogCount: 200
        backlogChars: 20000
        telegramEnabled: true
        telegramIntervalMs: 8000
        feishuEnabled: true
        feishuIntervalMs: 5000
        sources:
          wx:
            enabled: false          # 白名单（chats）是个人数据，不进仓库；在本地 config.json 里开
          github:
            enabled: false          # token 走 gh 登录态，不进配置；仓库白名单也在本地 config.json 里选
        routes:
          - sources: ["*"]
            sink: chief
        sinks: {}
