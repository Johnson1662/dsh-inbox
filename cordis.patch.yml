# dsh-personal-context —— 壳包：只负责把三个组件插进组合。
# 装这一个包，pnpm 会把 core 与两路来源一起装下来。
- insert:
    - id: dsh-personal-context-core
      name: dsh-personal-context-core
      config:
        enabled: true
        stateDir: ~/.dsh/state/personal-context
        sink: chief
        intervalMs: 500
        batchCount: 50
        batchChars: 4000
        backlogCount: 200
        backlogChars: 20000
        telegramEnabled: true
        telegramIntervalMs: 8000
        feishuEnabled: true
        feishuIntervalMs: 5000
        routes:
          - sources: ["*"]
            sink: session-bcba45c8-199d-4f99-8774-bf2b91091466
        sinks:
          chief:
            kind: dsh-session
            botId: session-bcba45c8-199d-4f99-8774-bf2b91091466
            sessionId: session-b4d09876-a9a1-47dc-8c3f-9f4633282ada
    - id: dsh-personal-context-source-telegram
      name: dsh-personal-context-source-telegram
    - id: dsh-personal-context-source-feishu
      name: dsh-personal-context-source-feishu
